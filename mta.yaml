_schema-version: '3.1'
ID: F_TNDR_CAG_FAST_UI_TEMPLATES
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npm run build:cf
modules:
  - name: F_TNDR_CAG_FAST_UI_TEMPLATES-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: F_TNDR_CAG_FAST_UI_TEMPLATES-db
      - name: uaa_FAST
      - name: F_TNDR_CAG_FAST_UI_TEMPLATES-dest-service

  - name: F_TNDR_CAG_FAST_UI_TEMPLATES-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: F_TNDR_CAG_FAST_UI_TEMPLATES-db

resources:
  - name: F_TNDR_CAG_FAST_UI_TEMPLATES-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared 
  - name: F_TNDR_CAG_FAST_UI_TEMPLATES-dest-service
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
            - Authentication: NoAuthentication
              Name: ui5
              ProxyType: Internet
              Type: HTTP
              URL: https://ui5.sap.com
            - Authentication: NoAuthentication
              Name: fast-templates-api
              ProxyType: Internet
              Type: HTTP
              URL: ~{srv-api/srv-url}
              HTML5.DynamicDestination: true
              HTML5.ForwardAuthToken: true
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: bc-dest-srv
      service-plan: lite
  - name: uaa_FAST
    parameters:
      path: ./xs-security.json
      service-plan: application
      service: xsuaa
    type: org.cloudfoundry.managed-service